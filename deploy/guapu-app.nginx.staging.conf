# Só instalar depois de apontar um hostname de homologação para a VPS.
# O cutover público dos domínios fica bloqueado até a Fase 8 ser aprovada.
server {
    listen 443 ssl http2;
    server_name guapu-staging.agentesnasaude.com.br;

    location / {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
