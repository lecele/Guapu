name: Sincronizar Google Drive com RAG

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-drive-rag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_ENV: production
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      DRIVE_SYNC_MAX_FILES: "10"
      RAG_TABLE_NAME: documents
      INGESTION_CHUNK_SIZE: "1000"
      INGESTION_CHUNK_OVERLAP: "150"
      INGESTION_BATCH_SIZE: "20"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validar segredos obrigatórios
        shell: bash
        run: |
          missing=0
          for name in GOOGLE_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DRIVE_FOLDER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado nos Secrets do repositório."
              missing=1
            fi
          done
          exit "$missing"

      - name: Instalar dependências
        run: python -m pip install --requirement requirements.txt

      - name: Reconciliar Drive e RAG
        run: python cron_sync.py
