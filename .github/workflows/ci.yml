name: Validar Guapu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:flow
      - run: npx tsc --noEmit
      - run: npm run build

  drive-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências da sincronização
        run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q config.py db rag services cron_sync.py queue_drive_sync.py drive_sync_worker.py main.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
